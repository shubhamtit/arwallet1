<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Account Login</title>
<style>
  :root {
    --yellow: #FFC20E;
    --yellow-dark: #D7A900;
    --navy: #292E37;
    --gray-text: #6B7280;
    --field-bg: #F5F5F6;
    --page-bg: #FFFFFF;
    --help-bg: #EAEBEF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--page-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--navy);
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 21px 40px;
    min-height: 100vh;
  }
  .lang-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 9px;
    font-size: 17px;
    line-height: 1.25;
    color: #343943;
    margin-bottom: 31px;
  }
  .lang-row .globe { display: block; width: 24px; height: 24px; color: #626B79; }
  h1.title {
    font-size: 38px;
    line-height: 1.15;
    font-weight: 700;
    margin: 0 0 27px;
    color: var(--navy);
    letter-spacing: -0.7px;
  }
  .field-label {
    font-size: 17px;
    line-height: 1.35;
    color: var(--navy);
    margin-bottom: 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .forgot-link {
    color: var(--yellow-dark);
    font-size: 17px;
    text-decoration: none;
    font-weight: 500;
    white-space: nowrap;
  }
  .phone-field {
    display: flex;
    align-items: center;
    background: var(--field-bg);
    border-radius: 6px;
    min-height: 51px;
    padding: 8px 13px;
    margin-bottom: 26px;
    gap: 11px;
  }
  .phone-field .flag { display: block; width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%; overflow: hidden; }
  .phone-field .code {
    font-size: 17px;
    line-height: 1.3;
    color: #252A32;
    padding-right: 0;
    margin-right: 2px;
    white-space: nowrap;
  }
  .phone-field input {
    border: none;
    background: transparent;
    outline: none;
    font: inherit;
    font-size: 16px;
    flex: 1;
    color: var(--navy);
    min-width: 0;
    padding: 0;
  }
  input::placeholder { color: #B9BBC3; opacity: 1; }
  .password-field {
    position: relative;
    display: flex;
    align-items: center;
    background: var(--field-bg);
    border-radius: 6px;
    min-height: 51px;
    padding: 8px 44px 8px 12px;
    margin-bottom: 53px;
  }
  .password-field input {
    border: none;
    background: transparent;
    outline: none;
    font: inherit;
    font-size: 16px;
    width: 100%;
    min-width: 0;
    color: var(--navy);
    padding: 0;
  }
  .toggle-eye {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: #9DA0A5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toggle-eye svg { display: block; width: 23px; height: 23px; }
  .btn {
    display: block;
    width: 100%;
    border: none;
    border-radius: 5px;
    min-height: 52px;
    padding: 13px 16px;
    font-family: inherit;
    font-size: 18px;
    line-height: 1.35;
    font-weight: 700;
    cursor: pointer;
    margin: 0 0 26px;
  }
  .btn-primary { background: var(--yellow); color: #4A3900; }
  .btn-primary:active { background: var(--yellow-dark); }
  .btn-secondary { background: var(--help-bg); color: #343943; font-weight: 600; margin-bottom: 0; }
  .no-account {
    text-align: left;
    font-size: 17px;
    line-height: 1.4;
    color: #343434;
    margin-top: 36px;
    white-space: nowrap;
  }
  .no-account a {
    color: var(--yellow-dark);
    text-decoration: none;
    font-weight: 600;
    margin-left: 5px;
  }
  .messages { list-style: none; padding: 0; margin: 0 0 20px; }
  .messages li { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 8px; }
  .messages li.success { background: #E6F6EA; color: #1D7A3A; }
  .messages li.error { background: #FCE8E6; color: #C53929; }
  @media (max-width: 360px) {
    .screen { padding-left: 18px; padding-right: 18px; }
    h1.title { font-size: 34px; }
    .phone-field { gap: 8px; padding-left: 10px; padding-right: 10px; }
    .phone-field input, .password-field input { font-size: 14px; }
    .forgot-link { font-size: 14px; }
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="lang-row">
      <svg class="globe" viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="16" cy="16" r="13.2"/><path d="M3.5 16h25M16 2.8c4.1 3.8 6.1 8.2 6.1 13.2S20.1 25.4 16 29.2C11.9 25.4 9.9 21 9.9 16S11.9 6.6 16 2.8Z"/><path d="M6.3 7.4c2.8 2 6.1 3 9.7 3s6.9-1 9.7-3M6.3 24.6c2.8-2 6.1-3 9.7-3s6.9 1 9.7 3"/>
      </svg>
      <span>English</span>
    </div>

    <h1 class="title">Account Login</h1>

    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    <form method="post" novalidate>
      {% csrf_token %}

      <div class="field-label">Phone Number</div>
      <div class="phone-field">
        <span class="flag" aria-label="India flag">
          <svg viewBox="0 0 36 36" width="34" height="34" role="img" aria-hidden="true">
            <defs><clipPath id="flagCircle"><circle cx="18" cy="18" r="18"/></clipPath></defs>
            <g clip-path="url(#flagCircle)"><rect width="36" height="12" fill="#FF9933"/><rect y="12" width="36" height="12" fill="#FFFFFF"/><rect y="24" width="36" height="12" fill="#138808"/><circle cx="18" cy="18" r="3.1" fill="none" stroke="#000080" stroke-width="1.1"/><path d="M18 14.9v6.2M14.9 18h6.2M15.8 15.8l4.4 4.4M20.2 15.8l-4.4 4.4" stroke="#000080" stroke-width=".55"/></g>
          </svg>
        </span>
        <span class="code">+91</span>
        <input type="tel" name="phone_number" placeholder="Please enter your phone number." inputmode="numeric" maxlength="15" required>
      </div>

      <div class="field-label">
        <span>Password</span>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>
      <div class="password-field">
        <input type="password" name="password" id="password" placeholder="Please enter your login password." required>
        <button type="button" class="toggle-eye" id="toggleEye" aria-label="Show password">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <button type="submit" class="btn btn-primary">Log In</button>
    </form>

    <button type="button" class="btn btn-secondary" onclick="window.location.href='#'">Help Center</button>

    <div class="no-account">
      No Account? <a href="#">Register Now</a>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('toggleEye');
    const pwInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOpen = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>';
    const eyeClosed = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.3 21.3 0 0 1 5.17-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.3 21.3 0 0 1-3.22 4.44"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    toggleBtn.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      eyeIcon.innerHTML = isHidden ? eyeClosed : eyeOpen;
      toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  </script>
</body>
</html>
